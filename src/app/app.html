<main class="app">
  <h1 class="app-title">Prévisions météo</h1>

  <label for="city-select">Ville :</label>
  <select id="city-select"[(ngModel)]="selectedCity" (ngModelChange)="onCityChange($event)">
    <option value="" disabled selected>-- Choisir une ville --</option>
    @for (city of cities; track city) {
      <option [value]="city">{{ city }}</option>
    }
  </select>

  <section aria-live="polite">
    @if (loading()) {
      <p>Chargement...</p>
    }

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    @if (dailySummary().length > 0) {
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Min</th>
            <th>Max</th>
          </tr>
        </thead>
        <tbody>
          @for (day of dailySummary(); track day.date) {
            <tr>
              <td>{{ day.date }}</td>
              <td>{{ day.min.toFixed(1) }}°C</td>
              <td>{{ day.max.toFixed(1) }}°C</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </section>
</main>
